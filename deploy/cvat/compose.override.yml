# Overrides for the pinned, unmodified upstream CVAT Compose deployment.
# Never expose the development instance on all public interfaces.
services:
  traefik:
    container_name: hpb_cvat_traefik
    ports: !override
      - "${CVAT_BIND_ADDRESS:-127.0.0.1}:${CVAT_HTTP_PORT:-8080}:8080"
    environment:
      TRAEFIK_PROVIDERS_DOCKER_NETWORK: hpb-cvat_cvat
  cvat_db:
    container_name: hpb_cvat_db
  cvat_redis_inmem:
    container_name: hpb_cvat_redis_inmem
  cvat_redis_ondisk:
    container_name: hpb_cvat_redis_ondisk
  cvat_server:
    container_name: hpb_cvat_server
  cvat_ui:
    container_name: hpb_cvat_ui
  cvat_opa:
    container_name: hpb_cvat_opa
  cvat_worker_utils:
    container_name: hpb_cvat_worker_utils
  cvat_worker_import:
    container_name: hpb_cvat_worker_import
  cvat_worker_export:
    container_name: hpb_cvat_worker_export
  cvat_worker_annotation:
    container_name: hpb_cvat_worker_annotation
  cvat_worker_webhooks:
    container_name: hpb_cvat_worker_webhooks
  cvat_worker_quality_reports:
    container_name: hpb_cvat_worker_quality_reports
  cvat_worker_chunks:
    container_name: hpb_cvat_worker_chunks
  cvat_worker_consensus:
    container_name: hpb_cvat_worker_consensus
  cvat_clickhouse:
    container_name: hpb_cvat_clickhouse
  cvat_vector:
    container_name: hpb_cvat_vector
  cvat_grafana:
    container_name: hpb_cvat_grafana
