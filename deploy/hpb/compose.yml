# bitcoind + a nostr relay for a live, human-paced job.
#
# Both bind to HPB_BIND_ADDRESS only (default loopback) — never all public
# interfaces. bitcoind's entrypoint runs as root on purpose: it remaps its own
# bitcoin user to UID/GID and then drops privileges, which is what keeps the
# RPC cookie readable by the launcher running outside Docker. Overriding
# `user:` there breaks it (usermod needs root).
name: hpb

services:
  bitcoind:
    image: bitcoin/bitcoin:29.0
    container_name: hpb_bitcoind
    environment:
      UID: "${HPB_UID:-1000}"
      GID: "${HPB_GID:-1000}"
    command:
      - -regtest
      - -txindex
      - -server
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -fallbackfee=0.0001
      - -printtoconsole
    volumes:
      - ./data/bitcoin:/home/bitcoin/.bitcoin
    ports:
      - "${HPB_BIND_ADDRESS:-127.0.0.1}:18443:18443"
    restart: unless-stopped

  # Nothing in RoleStack mines, so every confirmation wait would block forever
  # without this. It also creates the wallets and funds the launcher's.
  miner:
    image: bitcoin/bitcoin:29.0
    container_name: hpb_miner
    depends_on: [bitcoind]
    volumes:
      - ./data/bitcoin:/home/bitcoin/.bitcoin
      - ./miner.sh:/miner.sh:ro
    entrypoint: ["/bin/bash", "/miner.sh"]
    environment:
      UID: "${HPB_UID:-1000}"
      GID: "${HPB_GID:-1000}"
      HPB_BLOCK_SECONDS: "${HPB_BLOCK_SECONDS:-10}"
      HPB_WALLET: "${HPB_WALLET:-hpb}"
    restart: unless-stopped

  relay:
    image: scsibug/nostr-rs-relay:latest
    container_name: hpb_relay
    user: "${HPB_UID:-1000}:${HPB_GID:-1000}"
    volumes:
      - ./data/relay:/usr/src/app/db
    ports:
      - "${HPB_BIND_ADDRESS:-127.0.0.1}:6969:8080"
    restart: unless-stopped
